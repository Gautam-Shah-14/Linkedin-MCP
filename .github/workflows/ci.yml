name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build -w apps/server

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tb_linkedin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run migrations
        working-directory: apps/server
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tb_linkedin_test

      - name: Run server tests
        run: npm test -w apps/server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tb_linkedin_test
          JWT_SIGNING_KEY: ci-test-jwt-signing-key
          TOKEN_ENCRYPTION_KEY: mExeL01lOoBY0oxaUU35aYkLZE+3ucV+k2DKOdBADTc=
          LINKEDIN_VERSION: '202401'
          LINKEDIN_MOCK: 'true'
